<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
<title id="title">目标架构与当前实现范围</title>
<desc id="desc">一个 Codex 主 Agent + 统一 Skill + 本地路由与检索工具。公开版初始仅有 2 条合成演示数据，不是医学证据。模式可选 ≠ 资料已接入。 待扩展：复杂问题拆解、已知事实 / 缺失信息 / 待验证假设的结构化管理。待扩展：独立原件核验、系统性学术分歧审查、医学风险校核</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17212b}.heading{font-size:27px;font-weight:600}.body{font-size:23px}.secondary{font-size:21px;fill:#46566a}.pill{font-size:21px;font-weight:600}</style>
<rect width="1600" height="1200" rx="28" fill="#f8fafc"/>
<text x="48" y="57" class="heading" text-anchor="start">目标架构与当前实现范围</text>
<text x="48" y="91" class="secondary" text-anchor="start">一个 Codex 主 Agent + 统一 Skill + 本地路由与检索工具</text>
<rect x="990" y="34" width="96" height="36" rx="18" fill="#e3f2e9"/>
<text x="1005" y="59" class="pill" style="fill:#186344">已实现</text>
<rect x="1115" y="34" width="184" height="36" rx="18" fill="#fff0ce"/>
<text x="1130" y="59" class="pill" style="fill:#7c4b00">需依法导入资料</text>
<rect x="1370" y="34" width="96" height="36" rx="18" fill="#e9edf4"/>
<text x="1385" y="59" class="pill" style="fill:#4b5770">待扩展</text>
<rect x="48" y="122" width="1504" height="108" rx="18" fill="#eef2f6" stroke="#d8e0e8"/>
<text x="800" y="165" class="heading" text-anchor="middle">用户提出中医文献问题</text>
<text x="800" y="202" class="body" text-anchor="middle">经典释义 / 文献中的证候分析 / 方证比较 / 医家观点</text>
<path d="M800 231 V263" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="270" width="1504" height="143" rx="18" fill="#ffffff" stroke="#d8e0e8"/>
<text x="77" y="313" class="heading" text-anchor="start">主 Agent：Codex + jingfang-research</text>
<rect x="1390" y="286" width="96" height="36" rx="18" fill="#e3f2e9"/>
<text x="1405" y="311" class="pill" style="fill:#186344">已实现</text>
<text x="77" y="354" class="body" text-anchor="start">已实现：常见问题识别、医家 / 模式路由、会话内切换与分源检索</text>
<text x="77" y="390" class="secondary" text-anchor="start">待扩展：复杂问题拆解、已知事实 / 缺失信息 / 待验证假设的结构化管理</text>
<path d="M800 414 V440 M294 440 H1306" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M294 440 V467" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 440 V467" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1306 440 V467" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="476" width="492" height="196" rx="18" fill="#ffffff" stroke="#d8e0e8"/>
<text x="72" y="516" class="heading" text-anchor="start">经典文献模块</text>
<rect x="268" y="490" width="184" height="36" rx="18" fill="#fff0ce"/>
<text x="283" y="515" class="pill" style="fill:#7c4b00">需依法导入资料</text>
<text x="72" y="560" class="secondary" text-anchor="start">classics 检索与导入接口已实现</text>
<text x="72" y="600" class="secondary" text-anchor="start">伤寒论 / 金匮 / 内经 / 本草等原文</text>
<text x="72" y="640" class="secondary" text-anchor="start">公开包没有真实经典原文库</text>
<rect x="554" y="476" width="492" height="196" rx="18" fill="#ffffff" stroke="#d8e0e8"/>
<text x="578" y="516" class="heading" text-anchor="start">倪海厦资料模块</text>
<rect x="774" y="490" width="184" height="36" rx="18" fill="#fff0ce"/>
<text x="789" y="515" class="pill" style="fill:#7c4b00">需依法导入资料</text>
<text x="578" y="560" class="secondary" text-anchor="start">nihaixia 独立视角接口已实现</text>
<text x="578" y="600" class="secondary" text-anchor="start">人纪 / 经方解释 / 医案 / 课程</text>
<text x="578" y="640" class="secondary" text-anchor="start">公开包没有医家原文或课程库</text>
<rect x="1060" y="476" width="492" height="196" rx="18" fill="#ffffff" stroke="#d8e0e8"/>
<text x="1084" y="516" class="heading" text-anchor="start">其他经方医家</text>
<rect x="1406" y="490" width="96" height="36" rx="18" fill="#e9edf4"/>
<text x="1421" y="515" class="pill" style="fill:#4b5770">待扩展</text>
<text x="1084" y="560" class="secondary" text-anchor="start">李可：like 接口已实现，资料需导入</text>
<text x="1084" y="600" class="secondary" text-anchor="start">胡希恕 / 刘渡舟 / 黄煌：待扩展</text>
<text x="1084" y="640" class="secondary" text-anchor="start">尚未建立其他医家的可用资料模块</text>
<path d="M294 673 V698 H1306 V673 M800 673 V698" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M800 698 V725" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="734" width="1504" height="160" rx="18" fill="#ffffff" stroke="#d8e0e8"/>
<text x="77" y="775" class="heading" text-anchor="start">来源核查与风险提示</text>
<rect x="1390" y="750" width="96" height="36" rx="18" fill="#e3f2e9"/>
<text x="1405" y="775" class="pill" style="fill:#186344">已实现</text>
<text x="77" y="815" class="body" text-anchor="start">已实现：来源字段、短引哈希 / 文件检查、去重与证据编号展开</text>
<text x="77" y="849" class="secondary" text-anchor="start">规则约束：来源状态标注、缺口说明、个体诊疗限制与毒性风险提示</text>
<text x="77" y="881" class="secondary" text-anchor="start">待扩展：独立原件核验、系统性学术分歧审查、医学风险校核</text>
<path d="M800 895 V926" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="935" width="1504" height="144" rx="18" fill="#ffffff" stroke="#d8e0e8"/>
<text x="77" y="976" class="heading" text-anchor="start">交叉分析与可追溯输出</text>
<text x="77" y="1014" class="body" text-anchor="start">已实现：分源证据包与引用追溯；中文综合由 Codex 按规则组织</text>
<text x="77" y="1050" class="secondary" text-anchor="start">有相关真实资料且实际检得时：经典依据 → 倪师解释 → 李可异同 → 未决问题</text>
<text x="800" y="1110" class="secondary" text-anchor="middle">输出质量取决于资料与模型；不能把检索成功当作结论已核实</text>
<text x="800" y="1142" class="secondary" text-anchor="middle">公开版初始仅有 2 条合成演示数据，不是医学证据。模式可选 ≠ 资料已接入。</text>
<text x="800" y="1172" class="secondary" text-anchor="middle">A / B / C / D 为来源核验状态，不是临床有效性等级；本工具不用于个体诊疗。</text>
</svg>
