<text x="77" y="849" class="secondary" text-anchor="start">規則約束：來源狀態標註、缺口說明、個人診療限制與毒性風險提示</text>
<text x="77" y="881" class="secondary" text-anchor="start">待擴充：獨立原件核驗、系統性學術分歧審查、醫學風險校核</text>
