<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
<title id="title">目標架構與目前實作範圍</title>
<desc id="desc">一個 Codex 主 Agent + 統一 Skill + 本機路由與檢索工具。公開版初始僅有 2 筆合成示範資料，不是醫學證據。可選模式 ≠ 已接入資料。 待擴充：複雜問題拆解、已知事實 / 缺少資訊 / 待驗證假設的結構化管理。待擴充：獨立原件核驗、系統性學術分歧審查、醫學風險校核</desc>
