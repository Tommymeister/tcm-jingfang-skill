<text x="77" y="1014" class="body" text-anchor="start">已實作：分來源證據包與引用追溯；中文綜合由 Codex 依規則組織</text>
<text x="77" y="1050" class="secondary" text-anchor="start">有相關真實資料且實際檢得時：經典依據 → 倪師解釋 → 李可異同 → 未決問題</text>
<text x="800" y="1110" class="secondary" text-anchor="middle">輸出品質取決於資料與模型；不能把檢索成功視為結論已核實</text>
<text x="800" y="1142" class="secondary" text-anchor="middle">公開版初始僅有 2 筆合成示範資料，不是醫學證據。可選模式 ≠ 已接入資料。</text>
<text x="800" y="1172" class="secondary" text-anchor="middle">A / B / C / D 為來源核驗狀態，不是臨床有效性等級；本工具不用於個人診療。</text>
